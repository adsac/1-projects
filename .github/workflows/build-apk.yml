name: Build Android APK

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: party-games
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: party-games
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp party-games/app/build/outputs/apk/debug/app-debug.apk party-games-latest.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: party-games-debug-apk
          path: party-games-latest.apk

      - name: Publish rolling release
        if: github.ref == 'refs/heads/claude/android-multiplayer-games-4NYnb'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Party Games (latest build)
          body: |
            Latest Party Games APK, auto-built from the `claude/android-multiplayer-games-4NYnb` branch.

            **To install:** Tap `party-games-latest.apk` below on your Android phone, then open it to install. You may need to allow "Install unknown apps" for your browser/file manager in Settings.
          files: party-games-latest.apk
          prerelease: true
          make_latest: 'true'
