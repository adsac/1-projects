<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modi'in City Simulator</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="loading">
    <div class="loader-title">Modi'in City Simulator</div>
    <div class="loader-sub">מדמה העיר מודיעין</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
    <div class="loader-hint">Building the city...</div>
  </div>

  <div id="hud" class="hidden">
    <div id="top-left" class="panel">
      <div id="neighborhood">—</div>
      <div id="street">—</div>
      <div id="landmark-near"></div>
    </div>

    <div id="top-right" class="panel">
      <div id="clock">00:00</div>
      <div id="time-of-day">Day</div>
      <div id="tour-progress">Tour: 0/0</div>
    </div>

    <div id="bottom-center" class="panel">
      <div id="speed-value">0</div>
      <div id="speed-unit">km/h</div>
      <div id="gear-indicator">D</div>
    </div>

    <div id="compass" class="panel">
      <div id="compass-dial"><span id="compass-n">N</span></div>
      <div id="compass-label">N</div>
    </div>

    <div id="minimap-wrap" class="panel">
      <canvas id="minimap" width="220" height="220"></canvas>
      <div id="minimap-label">מודיעין / Modi'in</div>
    </div>

    <div id="help" class="panel">
      <div><b>W / ↑</b> accelerate</div>
      <div><b>S / ↓</b> reverse / brake</div>
      <div><b>A D / ← →</b> steer</div>
      <div><b>Space</b> handbrake</div>
      <div><b>C</b> camera view</div>
      <div><b>H</b> horn</div>
      <div><b>N</b> toggle night</div>
      <div><b>R</b> respawn</div>
      <div><b>M</b> toggle map</div>
    </div>

    <div id="notice"></div>
    <div id="horn-indicator">🔊</div>
  </div>

  <canvas id="game"></canvas>

  <script type="module" src="src/main.js"></script>
</body>
</html>
